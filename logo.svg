<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <!-- Gradient definitions for metallic gold -->
  <defs>
    <!-- Light gold for highlights (top faces of the bars) -->
    <linearGradient id="gold-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEFA8" />
      <stop offset="100%" stop-color="#D9B752" />
    </linearGradient>
    
    <!-- Medium gold for mid-tones (left-facing sides) -->
    <linearGradient id="gold-med" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D9B752" />
      <stop offset="100%" stop-color="#A6842D" />
    </linearGradient>

    <!-- Dark gold for shadows (right-facing sides) -->
    <linearGradient id="gold-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A6842D" />
      <stop offset="100%" stop-color="#735613" />
    </linearGradient>
    
    <!-- Outer ring border gold gradient -->
    <linearGradient id="gold-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEFA8" />
      <stop offset="50%" stop-color="#C8A84B" />
      <stop offset="100%" stop-color="#735613" />
    </linearGradient>
  </defs>

  <!-- Deep navy background card representation (optional border frame) -->
  <rect width="40" height="40" rx="10" fill="#1a1a2e" stroke="url(#gold-border)" stroke-width="1.5" />

  <!-- Rising Trendline in the background -->
  <path d="M 8,31 L 16,23 L 23,23 L 31,13" stroke="#FFEFA8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  <!-- Arrow Head -->
  <path d="M 27,13 L 31,13 L 31,17" stroke="#FFEFA8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />

  <!-- 3D Gold Stack (3 Bars) -->
  <g>
    <!-- Bottom Left Bar -->
    <!-- Top Face -->
    <path d="M 7,24 L 13,20 L 21,20 L 15,24 Z" fill="url(#gold-light)" />
    <!-- Left Face -->
    <path d="M 7,24 L 15,24 L 15,29 L 7,29 Z" fill="url(#gold-med)" />
    <!-- Right Face -->
    <path d="M 15,24 L 21,20 L 21,25 L 15,29 Z" fill="url(#gold-dark)" />

    <!-- Bottom Right Bar -->
    <!-- Top Face -->
    <path d="M 19,24 L 25,20 L 33,20 L 27,24 Z" fill="url(#gold-light)" />
    <!-- Left Face -->
    <path d="M 19,24 L 27,24 L 27,29 L 19,29 Z" fill="url(#gold-med)" />
    <!-- Right Face -->
    <path d="M 27,24 L 33,20 L 33,25 L 27,29 Z" fill="url(#gold-dark)" />

    <!-- Top Bar -->
    <!-- Top Face -->
    <path d="M 13,15 L 19,11 L 27,11 L 21,15 Z" fill="url(#gold-light)" />
    <!-- Left Face -->
    <path d="M 13,15 L 21,15 L 21,20 L 13,20 Z" fill="url(#gold-med)" />
    <!-- Right Face -->
    <path d="M 21,15 L 27,11 L 27,16 L 21,20 Z" fill="url(#gold-dark)" />
  </g>
</svg>
